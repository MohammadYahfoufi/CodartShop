<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Animated earbuds icon</title><desc id="desc">Two earbuds bounce gently as wireless sound waves radiate.</desc>
  <defs><linearGradient id="g" x1="56" y1="54" x2="268" y2="266" gradientUnits="userSpaceOnUse"><stop stop-color="#168BFF"/><stop offset="1" stop-color="#8B35F5"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.left,.right{transform-box:fill-box;transform-origin:center}.left{animation:bob 2.7s ease-in-out infinite}.right{animation:bob 2.7s ease-in-out -.6s infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 2s ease-out infinite}@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}@keyframes wave{0%{transform:scale(.65);opacity:.9}70%,100%{transform:scale(1.18);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <circle cx="160" cy="160" r="105" fill="url(#g)" opacity=".08"/><g class="wave" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"><path d="M142 69a29 29 0 0 1 36 0"/><path d="M128 50a50 50 0 0 1 64 0"/></g>
  <g class="left" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M95 136c0-27 17-45 41-45 19 0 31 12 31 29 0 18-13 31-32 31h-11v75c0 12-7 20-18 20s-18-8-18-20v-75c0-7 2-11 7-15Z"/><path d="M113 119h23"/></g>
  <g class="right" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M225 136c0-27-17-45-41-45-19 0-31 12-31 29 0 18 13 31 32 31h11v75c0 12 7 20 18 20s18-8 18-20v-75c0-7-2-11-7-15Z"/><path d="M207 119h-23"/></g>
</svg>
