<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Codart Tech Core</title>
  <desc id="desc">A glowing animated technology hub in Codart blue and purple.</desc>
  <defs>
    <linearGradient id="core" x1="75" y1="66" x2="251" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#168BFF"/><stop offset=".52" stop-color="#5364FF"/><stop offset="1" stop-color="#913AF3"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#5364FF" stop-opacity=".38"/><stop offset=".55" stop-color="#4644D2" stop-opacity=".13"/><stop offset="1" stop-color="#302D92" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="wideGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <style>.core{transform-origin:160px 160px;animation:float 4s ease-in-out infinite}.pulse{transform-origin:160px 160px;animation:pulse 2.8s ease-out infinite}.spark{transform-origin:160px 160px;animation:spark 2.2s ease-in-out infinite}.dash{stroke-dasharray:6 12;animation:dash 4s linear infinite}@keyframes float{50%{transform:translateY(-5px) scale(1.015)}}@keyframes pulse{0%{transform:scale(.75);opacity:.65}75%,100%{transform:scale(1.2);opacity:0}}@keyframes spark{50%{transform:scale(1.09);filter:brightness(1.3)}}@keyframes dash{to{stroke-dashoffset:-36}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <circle cx="160" cy="160" r="144" fill="url(#halo)"/><circle class="pulse" cx="160" cy="160" r="110" fill="none" stroke="url(#core)" stroke-width="2.5"/><circle class="dash" cx="160" cy="160" r="128" fill="none" stroke="url(#core)" stroke-width="2" opacity=".24"/>
  <g class="core"><circle cx="160" cy="160" r="103" fill="#5260FF" opacity=".2" filter="url(#wideGlow)"/><path d="M160 55c22 0 84 40 95 59 11 20 11 72 0 92-11 19-73 59-95 59s-84-40-95-59c-11-20-11-72 0-92 11-19 73-59 95-59Z" fill="#101642" fill-opacity=".96" stroke="url(#core)" stroke-width="9"/><path d="M160 84c15 0 58 27 66 41 8 14 8 56 0 70-8 14-51 41-66 41s-58-27-66-41c-8-14-8-56 0-70 8-14 51-41 66-41Z" fill="url(#core)" opacity=".14"/><g class="spark" filter="url(#softGlow)"><path d="M160 105v110M105 160h110" stroke="url(#core)" stroke-width="8" stroke-linecap="round"/><circle cx="160" cy="160" r="23" fill="#172258" stroke="url(#core)" stroke-width="8"/><circle cx="160" cy="105" r="8" fill="#2384FF"/><circle cx="215" cy="160" r="8" fill="#7151FB"/><circle cx="160" cy="215" r="8" fill="#913AF3"/><circle cx="105" cy="160" r="8" fill="#2384FF"/><path d="m168 127-31 41h21l-10 30 32-43h-21z" fill="url(#core)"/></g></g>
</svg>
