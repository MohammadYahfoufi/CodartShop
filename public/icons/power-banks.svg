<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Animated power bank icon</title><desc id="desc">A power bank charges as its battery level rises and indicator lights pulse.</desc>
  <defs><linearGradient id="g" x1="62" y1="50" x2="260" y2="271" gradientUnits="userSpaceOnUse"><stop stop-color="#168BFF"/><stop offset="1" stop-color="#8B35F5"/></linearGradient><linearGradient id="fill" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#168BFF"/><stop offset="1" stop-color="#8B35F5"/></linearGradient><clipPath id="body"><rect x="86" y="61" width="148" height="211" rx="34"/></clipPath><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.level{transform-box:fill-box;transform-origin:center bottom;animation:charge 3.4s ease-in-out infinite}.led{animation:blink 1.4s ease-in-out infinite}.led:nth-child(2){animation-delay:.18s}.led:nth-child(3){animation-delay:.36s}.float{transform-box:fill-box;transform-origin:center;animation:float 3.4s ease-in-out infinite}@keyframes charge{0%,10%{transform:scaleY(.08);opacity:.4}70%,90%{transform:scaleY(1);opacity:.28}100%{transform:scaleY(.08);opacity:.4}}@keyframes blink{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.level{transform:scaleY(.65)}}</style>
  <circle cx="160" cy="166" r="119" fill="url(#g)" opacity=".07"/><g class="float"><rect class="level" x="86" y="61" width="148" height="211" rx="34" fill="url(#fill)" clip-path="url(#body)" opacity=".28"/><rect x="86" y="61" width="148" height="211" rx="34" fill="none" stroke="url(#g)" stroke-width="11"/><path d="M137 61V43h46v18" fill="none" stroke="url(#g)" stroke-width="10" stroke-linejoin="round"/><path d="m174 116-36 50h26l-13 43 39-57h-25z" fill="url(#g)" filter="url(#glow)"/><g fill="#6B59FF"><circle class="led" cx="135" cy="239" r="5"/><circle class="led" cx="160" cy="239" r="5"/><circle class="led" cx="185" cy="239" r="5"/></g></g>
</svg>
